[project]
name = "iosxe-georoute-runner"
version = "0.1.0"
description = "On-box IOS XE georoute candidate renderer and local apply helper"
readme = "README.ru.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
  { name = "Uzum E-Commerce" },
]
dependencies = [
  "httpx>=0.28.1",
  "prometheus-client>=0.23.1",
  "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.8",
  "ty>=0.0.1a33",
]

[project.scripts]
iosxe-georoute-runner = "iosxe_georoute_runner.__main__:main"

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iosxe_georoute_runner"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov=iosxe_georoute_runner --cov-report=term-missing"
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
